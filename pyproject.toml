[project]
name = "local-ollama-chatbot"
version = "0.1.0"
description = "Local LangChain + Ollama chatbot with FAISS semantic memory and SQLite chronological memory"
requires-python = ">=3.10"
dependencies = [
  "langchain>=0.2",
  "langchain-community>=0.2",
  "faiss-cpu>=1.8.0",
  "requests>=2.31",
]

[tool.uv]
index-strategy = "first-index"
